{% extends "base.html" %}
{% block title %}Sign up as a worker — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="container" style="padding:32px 16px;max-width:480px;">
  <h1>Find shifts near you</h1>
  <div class="card">
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn--primary btn--block" type="submit">Create account</button>
    </form>
  </div>
  <p>Hiring workers instead? <a href="{% url 'accounts_app:signup_facility' %}">Post shifts as a facility →</a></p>
</div>
{% endblock %}
